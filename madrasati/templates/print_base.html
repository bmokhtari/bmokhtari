{% load i18n static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}"{% if LANGUAGE_BIDI %} dir="rtl"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — {{ school.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #152520; --ink-2: #3E4C45; --muted: #5E6D65;
      --green-900: #0C3628; --green-700: #14573D;
      --green-100: #EEF5F1; --green-200: #C9DED2;
      --line: #E8E2D5; --gold: #C79A2E; --sand: #D9CDB8; --cream: #FBF6EC;
      --serif: Newsreader, Georgia, "Times New Roman", serif;
      --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #EFEAE0; color: var(--ink);
      font-family: var(--sans); font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      width: 210mm; min-height: 297mm; margin: 18px auto; background: #fff;
      padding: 16mm 15mm 14mm; display: flex; flex-direction: column;
      box-shadow: 0 2px 14px rgba(12, 54, 40, .13);
    }
    .ar { font-family: "IBM Plex Sans Arabic", var(--sans); unicode-bidi: isolate; }
    .num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
    .m-money { unicode-bidi: isolate; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* En-tête de l'établissement */
    .lh { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .lh-fr { display: flex; align-items: center; gap: 11px; }
    .lh-name { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--green-900); line-height: 1.15; }
    .lh-sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
    .lh-ar { text-align: right; direction: rtl; }
    .lh-ar .lh-name { font-size: 18px; }
    .lh-ar .lh-sub { line-height: 1.6; }
    .rule-zellige { margin-top: 12px; height: 14px; width: 100%; display: block; opacity: .75; }
    .rule-solid { height: 2px; background: var(--green-900); margin-top: 7px; }

    /* Titre du document */
    .doc-title { text-align: center; margin-top: 20px; }
    .doc-title h1 {
      font-family: var(--serif); font-size: 24px; font-weight: 600;
      color: var(--green-900); margin: 0; letter-spacing: .01em;
    }
    .doc-title .ar-title { font-size: 19px; font-weight: 600; color: var(--green-900); margin-top: 2px; }
    .doc-ref {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 11px;
      padding: 5px 14px; border: 1px solid var(--sand); border-radius: 999px; background: var(--cream);
    }
    .doc-ref b { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .doc-ref span { font-size: 13px; color: var(--muted); }
    .doc-ref i { width: 1px; height: 13px; background: var(--sand); display: inline-block; }

    /* Lignes d'information */
    .lines { margin-top: 18px; }
    .line {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      padding: 8px 0; border-bottom: 1px solid var(--line);
    }
    .lbl { font-size: 13px; color: var(--muted); }
    .val { font-size: 15px; font-weight: 500; margin-top: 3px; }
    .val-ar { text-align: right; font-weight: 500; }

    /* Encadré du montant */
    .amount {
      margin-top: 16px; border: 1px solid var(--green-200); background: var(--green-100);
      border-radius: 12px; padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .amount .k { font-size: 13px; color: var(--green-700); }
    .amount .v { font-size: 29px; font-weight: 600; color: var(--green-900); letter-spacing: -.02em; margin-top: 4px; }
    .amount .v-ar { font-size: 21px; font-weight: 600; color: var(--green-900); margin-top: 5px; }
    .in-words { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }

    /* Tableaux (bulletin de paie) */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
    thead th {
      font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase;
      color: var(--muted); font-weight: 500; background: var(--cream);
      border-bottom: 1px solid var(--sand);
    }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr.total td { font-weight: 600; background: var(--cream); }
    .box { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 14px; }
    .box > .box-h {
      font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--green-900);
      padding: 10px 14px; background: var(--cream); border-bottom: 1px solid var(--line);
    }

    /* Signatures et pied de page */
    .spacer { flex: 1; min-height: 16px; }
    .signatures { display: flex; justify-content: space-between; gap: 36px; margin-top: 22px; }
    .signatures div { flex: 1; text-align: center; }
    .sig-space { height: 34px; }
    .sig-label { border-top: 1px dashed #A9B5AE; padding-top: 8px; font-size: 12.5px; color: var(--muted); }
    .foot {
      margin-top: 16px; padding-top: 11px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; gap: 16px;
      font-size: 11.5px; color: #7C8981;
    }

    /* Barre d'actions (écran uniquement) */
    .toolbar { width: 210mm; margin: 16px auto 0; display: flex; gap: 10px; }
    .toolbar button, .toolbar a {
      font-family: var(--sans); font-size: 13.5px; font-weight: 500;
      padding: 9px 16px; border-radius: 9px; cursor: pointer; text-decoration: none;
      background: var(--green-700); color: #FFF8EC; border: 1px solid var(--green-900);
    }
    .toolbar a.ghost { background: #fff; color: var(--green-700); border-color: var(--sand); }
    .sheet--compact { min-height: auto; padding-bottom: 12mm; }
    .sheet--compact .spacer { min-height: 26px; flex: 0 0 auto; }

    /* Téléphones : la feuille A4 débordait de l'écran (210 mm figés). */
    @media (max-width: 820px) {
      .sheet, .toolbar { width: min(210mm, 100%); }
      .sheet { padding: 22px 18px 20px; margin: 10px auto; }
      .toolbar { padding: 0 4px; }
      .lh { flex-direction: column; gap: 12px; }
      .lh-ar { text-align: start; }
      .doc-title h1 { font-size: 21px; }
      .doc-title .ar-title { font-size: 17px; }
      .amount { flex-direction: column; align-items: flex-start; gap: 10px; }
      .amount .v { font-size: 25px; }
      .line { flex-direction: column; align-items: flex-start; gap: 4px; }
      .val-ar, .lh-ar { align-self: flex-start; }
      th, td { padding: 7px 9px; font-size: 12.5px; }
      .signatures { gap: 16px; }
      .foot { flex-direction: column; gap: 6px; }
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
      @page { size: A4; margin: 14mm; }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button type="button" onclick="window.print()">{% translate "Imprimer" %}</button>
  <a class="ghost" href="{% block back_url %}{% url 'admin:index' %}{% endblock %}">{% translate "Retour" %}</a>
</div>

<div class="sheet {% block sheet_class %}{% endblock %}">
  <header class="lh">
    <div class="lh-fr">
      <svg width="38" height="38" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="9" fill="#0C3628"/>
        <g stroke="#E8C46A" stroke-width="1.3" fill="none">
          <rect x="10" y="10" width="14" height="14"/>
          <rect x="10" y="10" width="14" height="14" transform="rotate(45 17 17)"/>
        </g>
      </svg>
      <div>
        <div class="lh-name">{{ school.name }}</div>
        <div class="lh-sub">{{ school.kind }}<br>{{ school.address }}</div>
      </div>
    </div>
    <div class="lh-ar ar">
      <div class="lh-name">{{ school.name_ar }}</div>
      <div class="lh-sub">{{ school.kind_ar }}<br>{{ school.address_ar }}</div>
    </div>
  </header>

  <svg class="rule-zellige" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 560 14">
    <defs>
      <pattern id="zellige" width="28" height="14" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#C79A2E" stroke-width=".9">
          <rect x="7" y="0" width="14" height="14"/>
          <rect x="7" y="0" width="14" height="14" transform="rotate(45 14 7)"/>
        </g>
      </pattern>
    </defs>
    <rect width="560" height="14" fill="url(#zellige)"/>
  </svg>
  <div class="rule-solid" aria-hidden="true"></div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
